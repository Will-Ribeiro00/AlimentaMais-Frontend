<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alimenta+ | Alterar Senha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  
  <link rel="stylesheet" href="../../css/perfilConsumidor/style.css">
</head>

<body>

  <aside class="sidebar">
    <nav class="navegacao-lateral">

      <div class="logo-container">
        <img
          src="../../imagens/logos/logo.png"
          alt="Logo Alimenta+"
          class="logo"
        >

        <h3 class="nome-projeto">Alimenta+</h3>
      </div>


      <ul class="lista-menu">

        <li>
          <a href="/pags/perfilConsumidor/index.html" id="btnInicio">
            <img
              src="../../imagens/icones/inicio.svg"
              alt="Ícone Início"
            >
            Início
          </a>
        </li>


        <li>
          <a href="/pags/reservas/index.html" id="btnReservas">
            <img
              src="../../imagens/icones/reservas.svg"
              alt="Ícone Minhas Reservas"
            >
            Minhas Reservas
          </a>
        </li>


        <li>
          <a
            href="/pags/perfilConsumidor/index.html"
            id="btnPerfil"
            class="ativo"
          >
            <img
              src="../../imagens/icones/perfil_laranja.svg"
              alt="Ícone Perfil"
            >
            Perfil
          </a>
        </li>

      </ul>


      <a href="/index.html" class="link-sair">
        <img
          src="../../imagens/icones/sair.svg"
          alt="Ícone Sair"
        >
        Sair
      </a>

    </nav>
  </aside>


  <main class="conteudo-principal">

    <!-- Botão de Voltar -->
    <a
      href="/pags/perfilConsumidor/index.html"
      class="botao-voltar"
    >
      <img
        src="../../imagens/icones/voltar.svg"
        alt="Voltar"
      >
    </a>


    <h1 class="titulo-principal">Alterar senha</h1>


    <!-- Formulário -->
    <form class="formulario-padrao">

      <div class="grupo-input">
        <input
          type="password"
          placeholder="Digite a senha atual"
          class="input-padrao"
          required
        >
      </div>


      <div class="grupo-input">
        <input
          type="password"
          aria-label="Nova senha"
          placeholder="Digite a nova senha"
          class="input-padrao"
          required
        >
      </div>


      <div class="grupo-input">
        <input
          type="password"
          aria-label="Confirmar nova senha"
          placeholder="Confirme a nova senha"
          class="input-padrao"
          required
        >
      </div>


      <button
        type="submit"
        class="btn-salvar"
      >
        Salvar alterações
      </button>

    </form>

  </main>

</body>
</html>
