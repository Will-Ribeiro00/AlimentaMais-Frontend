<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimenta+ | Minhas Reservas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../../css/global/style.css" />
    <link rel="stylesheet" href="../../css/consumidor/style.css" />
    <link rel="stylesheet" href="../../css/reservasConsumidor/style.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <nav class="navegacao-lateral">
        <div class="logo-container">
          <img src="../../imagens/logos/logo.png" alt="Logo Alimenta+" class="logo" />
          <h3 class="nome-projeto">Alimenta+</h3>
        </div>

        <ul class="lista-menu">
          <li><a href="/pags/consumidor/index.html" id="btnInicio"><i class="fa-solid fa-house"></i>Início</a></li>
          <li><a href="/pags/reservasConsumidor/index.html" id="btnReservas" class="ativo"><i class="fa-regular fa-calendar"></i>Minhas Reservas</a></li>
          <li><a href="/pags/perfilConsumidor/index.html" id="btnPerfil"><i class="fa-regular fa-circle-user"></i>Perfil</a></li>
        </ul>

        <a href="#" id="btnSair" class="link-sair">
          <img src="../../imagens/icones/sair.svg" alt="Ícone Sair" />
          Sair
        </a>
      </nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="conteudo-principal">
      <header class="cabecalho-pagina cabecalho-reservas">
        <div class="cabecalho-esquerda">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Abrir menu" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="cabecalho-perfil">
            <h2>Olá, Marcelo Alves!</h2>
            <p>Aqui você visualiza as reservas atuais e anteriores.</p>
          </div>
        </div>

        <div class="data-atual">
          <i class="fa-regular fa-calendar"></i>
          <span id="dataAtual"></span>
        </div>
      </header>

      <h1 class="titulo-principal">Minhas reservas</h1>

      <section class="lista-reservas" id="listaReservas" aria-live="polite"></section>
    </main>

    <script type="module" src="/js/consumidor/script.js"></script>
    <script src="/js/reservasConsumidor/script.js"></script>
  </body>
</html>
