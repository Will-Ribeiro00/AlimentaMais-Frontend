<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alimenta+ | Entrar</title>

  <link rel="icon" href="../../imagens/logos/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/global/style.css">
  <link rel="stylesheet" href="../../css/loginECadastro/style.css">
</head>
<body>

  <!-- PAINEL ESQUERDO (informativo) -->
  <section class="panel-left">
    <div class="logo-row">
      <img class="img-logo-left" src="../../imagens/logos/logo_completa.png" alt="Logo Alimenta+ com slogan: Reciclagem de alimentos, transformação de vidas.">
    </div>

    <div class="slogan">
      <h1>
        <span>Transformando<br>desperdício</span><br>
        <span class="accent-green">em valor.</span>
      </h1>

      <p>
        Conectamos excedentes de alimentos a novos destinos, gerando impacto positivo para todos
      </p>
    </div>

    <div class="features">
      <div class="feature">
        <div class="icon-circle">
          <img src="../../imagens/icones/folha.svg" alt="">
        </div>
        <p>Menos desperdício<br>Mais aproveitamento</p>
      </div>

      <div class="feature">
        <div class="icon-circle">
          <img src="../../imagens/icones/coracao.svg" alt="">
        </div>
        <p>Mais Economia<br>Para você</p>
      </div>

      <div class="feature">
        <div class="icon-circle">
          <img src="../../imagens/icones/grafico.svg" alt="">
        </div>
        <p>Mais impacto<br>para o mundo</p>
      </div>
    </div>
  </section>

  <!-- PAINEL DIREITO: (login) -->
  <section class="panel-right">
    <div>
      <img class="logo-panel-right" src="../../imagens/logos/logo.png" alt="Alimenta+">
    </div>

    <p class="right-tagline">
      reciclagem de alimentos,<br>transformação de vidas
    </p>

    <div class="tabs">
      <button type="button" class="tab active" id="tabEntrar">Entrar</button>
      <button type="button" class="tab" id="tabCriar">Criar conta</button>
    </div>

    <form id="loginForm">
      <label class="field">
        <img src="../../imagens/icones/carta.svg" alt="">
        <input type="email" name="email" placeholder="Digite seu e-mail" required>
      </label>

      <label class="field">
        <img src="../../imagens/icones/cadeado.svg" alt="">
        <input type="password" name="password" placeholder="Digite sua senha" required>
      </label>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" name="remember">
          Lembrar de mim
        </label>

        <a href="#naoexiste" class="forgot">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <!-- formulário de "Criar conta" -->
    <div id="painelCriarConta" style="display: none;">

      <!-- sub-abas: Consumidor / Estabelecimento -->
      <div class="tabs" style="margin-bottom: 25px;">
        <button type="button" class="tab active" id="tabConsumidor">Consumidor</button>
        <button type="button" class="tab" id="tabEstabelecimento">Estabelecimento</button>
      </div>

      <!-- formulário do Consumidor -->
      <form id="formConsumidor">
        <label class="field">
          <img src="../../imagens/icones/perfil.svg" alt="">
          <input type="text" name="nome" placeholder="Digite seu nome" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/documento.svg" alt="">
          <input type="text" name="cpf" placeholder="Digite seu CPF" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/carta.svg" alt="">
          <input type="email" name="email" placeholder="Digite seu e-mail" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/cadeado.svg" alt="">
          <input type="password" name="senha" placeholder="Digite sua senha" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/cadeado.svg" alt="">
          <input type="password" name="confirmarSenha" placeholder="Confirme sua senha" required>
        </label>

        <button type="submit" class="btn">Cadastrar-se</button>
      </form>

      <!-- formulário do Estabelecimento -->
      <form id="formEstabelecimento" style="display: none;">
        <label class="field">
          <img src="../../imagens/icones/perfil.svg">
          <input type="text" name="nomeResponsavel" placeholder="Digite o nome do responsável" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/documento.svg" alt="">
          <input type="text" name="cpfResponsavel" placeholder="Digite o CPF do responsável" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/documento.svg" alt="">
          <input type="text" name="cnpj" placeholder="Digite o CNPJ do estabelecimento" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/comercio.svg" alt="">
          <input type="text" name="nomeFantasia" placeholder="Digite o Nome Fantasia" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/localizacao.svg" alt="">
          <input type="text" name="endereco" placeholder="Digite o Endereço" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/categorias.svg" alt="">
          <select name="categoria" required>
            <option value="" disabled selected>Selecione a categoria</option>
            <option value="restaurante">Restaurante</option>
            <option value="mercado">Mercado</option>
            <option value="padaria">Padaria</option>
            <option value="outro">Outro</option>
          </select>
        </label>

        <label class="field">
          <img src="../../imagens/icones/carta.svg" alt="">
          <input type="email" name="email" placeholder="Digite seu e-mail" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/cadeado.svg" alt="">
          <input type="password" name="senha" placeholder="Digite sua senha" required>
        </label>

        <label class="field">
          <img src="../../imagens/icones/cadeado.svg" alt="">
          <input type="password" name="confirmarSenha" placeholder="Confirme sua senha" required>
        </label>

        <button type="submit" class="btn">Cadastrar-se</button>
      </form>

    </div>
  </section>

  <script type="module" src="../../js/loginECadastro/script.js"></script>
</body>
</html>
