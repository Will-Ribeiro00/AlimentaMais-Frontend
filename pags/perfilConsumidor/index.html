<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimenta+ | Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="/css/global/style.css"
    />

    <link rel="stylesheet" href="../../css/perfilConsumidor/style.css" />
  </head>

  <body>
    <aside class="sidebar">
      <nav class="navegacao-lateral">

        <div class="logo-container">
          <img
            src="../../imagens/logos/logo.png"
            alt="Logo Alimenta+"
            class="logo"
          />
          <h3 class="nome-projeto">Alimenta+</h3>
        </div>

        <ul class="lista-menu">

          <li>
            <a href="../consumidor/index.html" id="btnInicio">
              <img
                src="../../imagens/icones/inicio.svg"
                alt="Ícone Início"
              />
              Início
            </a>
          </li>

          <li>
            <a href="../reservas/index.html" id="btnReservas">
              <img
                src="../../imagens/icones/reservas.svg"
                alt="Ícone Minhas Reservas"
              />
              Minhas Reservas
            </a>
          </li>

          <li>
            <a
              href="../perfilConsumidor/index.html"
              id="btnPerfil"
              class="ativo"
            >
              <img
                src="../../imagens/icones/perfil_laranja.svg"
                alt="Ícone Perfil"
              />
              Perfil
            </a>
          </li>

        </ul>

        <a href="/index.html" class="link-sair" id="btnSair">
          <img
            src="../../imagens/icones/sair.svg"
            alt="Ícone Sair"
          />
          Sair
        </a>

      </nav>
    </aside>

    <main class="conteudo-principal">

      <header class="cabecalho-perfil">
        <h2>Olá, Fulano de Tal</h2>
        <p>Altere seu cadastro.</p>
      </header>

      <h1 class="titulo-principal">Conta</h1>

      <div class="quadro-dados">

        <div class="item-dado">
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/perfil.svg"
              alt="Ícone Usuário"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>Nome:</strong>
            <span>Fulano de Tal da Silva</span>
          </div>
        </div>

        <div class="item-dado">
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/documentov.svg"
              alt="Ícone Documento"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>CPF:</strong>
            <span>123.456.678-09</span>
          </div>
        </div>

        <a
          href="/pags/alterarsenhaConsumidor/index.html"
          class="item-dado"
        >
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/senha.svg"
              alt="Ícone Senha"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>Senha:</strong>
            <span>************</span>
          </div>

          <img
            src="../../imagens/icones/seta_direita.svg"
            alt="Seta"
            class="icone-seta"
          />
        </a>

        <a
          href="../alterarEmailConsumidor/index.html"
          class="item-dado"
        >
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/email.svg"
              alt="Ícone Email"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>Email:</strong>
            <span>atendimento@padariasaojoao.com.br</span>
          </div>

          <img
            src="../../imagens/icones/seta_direita.svg"
            alt="Seta"
            class="icone-seta"
          />
        </a>

        <a
          href="../alterarCelularConsumidor/index.html"
          class="item-dado"
        >
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/celular.svg"
              alt="Ícone Celular"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>Celular:</strong>
            <span>(11) 94378-0192</span>
          </div>

          <img
            src="../../imagens/icones/seta_direita.svg"
            alt="Seta"
            class="icone-seta"
          />
        </a>

        <a
          href="../excluircontaConsumidor/index.html"
          class="item-dado"
        >
          <div class="caixa-icone">
            <img
              src="../../imagens/icones/lixeira.svg"
              alt="Ícone Lixeira"
              class="icone-esquerda"
            />
          </div>

          <div class="info-texto">
            <strong>Excluir conta:</strong>
            <span></span>
          </div>

          <img
            src="../../imagens/icones/seta_direita.svg"
            alt="Seta"
            class="icone-seta"
          />
        </a>

      </div>
    </main>

    <script src="../../js/perfil/script.js"></script>
  </body>
</html>
