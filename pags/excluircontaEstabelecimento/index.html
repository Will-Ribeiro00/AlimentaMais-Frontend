<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alimenta+ | Excluir Conta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../css/perfilEstabelecimento/style.css">
</head>
<body>

  <aside class="sidebar">
    <nav class="navegacao-lateral">
      <div class="logo-container">
        <img src="../../imagens/logos/logo.png" alt="Logo Alimenta+" class="logo">
        <h3 class="nome-projeto">Alimenta+</h3>
      </div>

      <ul class="lista-menu">
        <li>
          <a href="#">
            <img src="../../imagens/icones/inicio.svg" alt="Ícone Início">
            Início
          </a>
        </li>
        <li>
          <a href="#">
            <img src="../../imagens/icones/reservas.svg" alt="Ícone Minhas Reservas">
            Minhas Reservas
          </a>
        </li>
        <li>
          <a href="#" class="ativo">
            <img src="../../imagens/icones/perfil.svg" alt="Ícone Perfil">
            Perfil
          </a>
        </li>
      </ul>

      <a href="/index.html" class="link-sair">
        <img src="../../imagens/icones/sair.svg" alt="Ícone Sair">
        Sair
      </a>
    </nav>
  </aside>

  <main class="conteudo-principal">
    
    <!-- Botão de Voltar -->
    <a href="/pags/perfilEstabelecimento/index.html" class="botao-voltar">
      <img src="../../imagens/icones/voltar.svg" alt="Voltar">
    </a>

    <h1 class="titulo-principal">Excluir conta</h1>

    <!-- Secção de Exclusão -->
    <form class="formulario-padrao">
      <p class="texto-exclusao">
        Você tem certeza que quer excluir sua conta?<br>
        A exclusão de conta é <strong>permanente</strong> e não poderá ser refeita.
      </p>


      <label class="grupo-checkbox">
        <input type="checkbox" required>
        <span>Sim, tenho certeza que quero excluir minha conta.</span>
      </label>
      
      <button type="submit" class="btn-excluir">Excluir minha conta</button>
    </form>

  </main>

</body>
</html>
