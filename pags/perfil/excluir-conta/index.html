<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Estabelecimento - Exclusão de conta
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="sidebar-content">

            <div class="logo-area">

                <div class="logo">

                    <i class="fa-solid fa-bread-slice"></i>

                    <span>+</span>

                </div>

                <h2>
                    Alimenta+
                </h2>

            </div>


            <nav class="navigation">

                <a
                    href="../../dashboard/index.html"
                    class="nav-item"
                >

                    <i class="fa-solid fa-house"></i>

                    <span>
                        Início
                    </span>

                </a>


                <a
                    href="../../reservas/index.html"
                    class="nav-item"
                >

                    <i class="fa-regular fa-calendar"></i>

                    <span>
                        Minhas Reservas
                    </span>

                </a>


                <a
                    href="../index.html"
                    class="nav-item active"
                >

                    <i class="fa-solid fa-circle-user"></i>

                    <span>
                        Perfil
                    </span>

                </a>

            </nav>

        </div>


        <a
            href="#"
            class="nav-item logout"
        >

            <i
                class="fa-solid fa-arrow-right-from-bracket"
            ></i>

            <span>
                Sair
            </span>

        </a>

    </aside>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <div class="content">


            <!-- VOLTAR -->

            <a
                href="../index.html"
                class="back-button"
                aria-label="Voltar para Perfil"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <!-- TÍTULO -->

            <h1>
                Excluir conta
            </h1>


            <div class="warning-box">

                <h2>
                    Excluir conta
                </h2>

                <p>
                    Você tem certeza que quer excluir sua conta?
                </p>

                <p>
                    A exclusão da conta é permanente e não poderá ser refeita.
                </p>

            </div>


            <!-- CONFIRMAÇÃO -->

            <label
                class="confirmation"
                for="confirmDelete"
            >

                <input
                    type="checkbox"
                    id="confirmDelete"
                >

                <span>
                    Sim, tenho certeza que quero excluir minha conta.
                </span>

            </label>


            <!-- BOTÃO -->

            <button
                type="button"
                class="delete-button"
                id="deleteButton"
            >

                Excluir minha conta

            </button>

        </div>

    </main>

</div>



<!-- =========================================
     MODAL
========================================= -->

<div
    class="modal-overlay"
    id="deleteModal"
    aria-hidden="true"
>

    <div
        class="delete-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >


        <!-- FECHAR -->

        <button
            type="button"
            class="close-modal"
            id="closeModal"
            aria-label="Fechar"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <!-- ÍCONE -->

        <div class="modal-icon">

            <i class="fa-solid fa-triangle-exclamation"></i>

        </div>


        <h2 id="modalTitle">
            Confirmar exclusão
        </h2>


        <p>
            Essa ação é permanente. Para continuar,
            confirme sua senha.
        </p>


        <!-- SENHA -->

        <div class="modal-field">

            <label for="deletePassword">
                Senha
            </label>

            <div class="password-wrapper">

                <input
                    id="deletePassword"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                    aria-label="Mostrar senha"
                >

                    <i class="fa-regular fa-eye"></i>

                </button>

            </div>

        </div>


        <!-- CHECKBOX -->

        <label
            class="modal-confirmation"
            for="modalConfirm"
        >

            <input
                type="checkbox"
                id="modalConfirm"
            >

            <span>
                Confirmo que desejo excluir minha conta
                permanentemente.
            </span>

        </label>


        <!-- ERRO -->

        <div
            id="modalMessage"
            class="modal-message"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- AÇÕES -->

        <div class="modal-actions">

            <button
                type="button"
                class="cancel-button"
                id="cancelDelete"
            >
                Cancelar
            </button>


            <button
                type="button"
                class="confirm-delete-button"
                id="confirmDeleteButton"
            >
                Excluir conta
            </button>

        </div>

    </div>

</div>


<script src="../../data.js"></script>

<script src="script.js"></script>

</body>

</html>
