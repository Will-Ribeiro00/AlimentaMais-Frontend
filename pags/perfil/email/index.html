<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Estabelecimento - Alterar email
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="sidebar-content">

            <div class="logo-area">

                <div class="logo">

                    <i class="fa-solid fa-bread-slice"></i>

                    <span>+</span>

                </div>

                <h2>
                    Alimenta+
                </h2>

            </div>


            <nav class="navigation">

                <a
                    href="../../dashboard/index.html"
                    class="nav-item"
                >

                    <i class="fa-solid fa-house"></i>

                    <span>
                        Início
                    </span>

                </a>


                <a
                    href="../../reservas/index.html"
                    class="nav-item"
                >

                    <i class="fa-regular fa-calendar"></i>

                    <span>
                        Minhas Reservas
                    </span>

                </a>


                <a
                    href="../index.html"
                    class="nav-item active"
                >

                    <i class="fa-solid fa-circle-user"></i>

                    <span>
                        Perfil
                    </span>

                </a>

            </nav>

        </div>


        <a
            href="#"
            class="nav-item logout"
        >

            <i
                class="fa-solid fa-arrow-right-from-bracket"
            ></i>

            <span>
                Sair
            </span>

        </a>

    </aside>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <div class="content">


            <!-- VOLTAR -->

            <a
                href="../index.html"
                class="back-button"
                aria-label="Voltar para Perfil"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <!-- TÍTULO -->

            <h1>
                Alterar email
            </h1>


            <!-- MENSAGEM -->

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- FORMULÁRIO -->

            <form
                id="emailForm"
                novalidate
            >


                <!-- EMAIL ATUAL -->

                <div class="field">

                    <label for="currentEmail">
                        Email atual
                    </label>

                    <input
                        id="currentEmail"
                        type="email"
                        readonly
                        autocomplete="email"
                    >

                </div>


                <!-- NOVO EMAIL -->

                <div class="field">

                    <label for="newEmail">
                        Novo email
                    </label>

                    <input
                        id="newEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="Digite o novo email"
                        required
                    >

                </div>


                <!-- SALVAR -->

                <button
                    type="submit"
                    class="save-button"
                >
                    Salvar alterações
                </button>

            </form>

        </div>

    </main>

</div>


<script src="../../data.js"></script>

<script src="script.js"></script>

</body>

</html>
