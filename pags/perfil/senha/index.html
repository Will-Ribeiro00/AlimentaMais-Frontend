<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Estabelecimento - Alterar senha
    </title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="app">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="sidebar-content">

            <div class="logo-area">

                <div class="logo">

                    <i class="fa-solid fa-bread-slice"></i>

                    <span>+</span>

                </div>

                <h2>
                    Alimenta+
                </h2>

            </div>


            <nav class="navigation">

                <a
                    href="../../dashboard/index.html"
                    class="nav-item"
                >
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>


                <a
                    href="../../reservas/index.html"
                    class="nav-item"
                >
                    <i class="fa-regular fa-calendar"></i>
                    <span>Minhas Reservas</span>
                </a>


                <a
                    href="../index.html"
                    class="nav-item active"
                >
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Perfil</span>
                </a>

            </nav>

        </div>


        <a
            href="#"
            class="nav-item logout"
        >

            <i
                class="fa-solid fa-arrow-right-from-bracket"
            ></i>

            <span>
                Sair
            </span>

        </a>

    </aside>



    <!-- =========================================
         CONTEÚDO
    ========================================== -->

    <main class="main">

        <div class="content">


            <!-- VOLTAR -->

            <a
                href="../index.html"
                class="back-button"
                aria-label="Voltar para Perfil"
            >

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <!-- TÍTULO -->

            <h1>
                Alterar senha
            </h1>


            <!-- MENSAGEM -->

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- FORMULÁRIO -->

            <form
                id="passwordForm"
                novalidate
            >


                <!-- SENHA ATUAL -->

                <div class="field">

                    <label for="currentPassword">
                        Senha atual
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="currentPassword"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Digite a senha anterior"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="currentPassword"
                            aria-label="Mostrar senha atual"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- NOVA SENHA -->

                <div class="field">

                    <label for="newPassword">
                        Nova senha
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="newPassword"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Digite a nova senha"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="newPassword"
                            aria-label="Mostrar nova senha"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                    <small>
                        A senha deve ter pelo menos 6 caracteres.
                    </small>

                </div>


                <!-- CONFIRMAR -->

                <div class="field">

                    <label for="confirmPassword">
                        Confirmar nova senha
                    </label>

                    <div class="input-wrapper">

                        <input
                            id="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Confirme a nova senha"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            data-target="confirmPassword"
                            aria-label="Mostrar confirmação da senha"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- SALVAR -->

                <button
                    type="submit"
                    class="save-button"
                >
                    Salvar alterações
                </button>

            </form>

        </div>

    </main>

</div>


<script src="../../data.js"></script>

<script src="script.js"></script>

</body>

</html>
