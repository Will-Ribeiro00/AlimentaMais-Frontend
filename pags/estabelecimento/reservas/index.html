<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimenta+ | Reservas</title>
    <link rel="icon" href="../../../imagens/logos/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../../../css/painel.css" />
    <link rel="stylesheet" href="../../../css/estabelecimento/reservas.css" />
  </head>
  <body class="painel" data-area="estabelecimento">
    <aside class="sidebar" id="sidebar">
      <a href="../dashboard/index.html" class="sidebar__marca">
        <img src="../../../imagens/logos/logo.png" alt="Logo Alimenta+" />
        <span class="sidebar__nome" data-nome-estabelecimento>Alimenta+</span>
      </a>

      <nav aria-label="Menu principal">
        <ul class="menu">
          <li>
            <a href="../dashboard/index.html" class="menu__link">
              <i class="fa-solid fa-table-columns"></i>Dashboard
            </a>
          </li>
          <li>
            <a href="../minhasOfertas/index.html" class="menu__link">
              <i class="fa-solid fa-tag"></i>Minhas Ofertas
            </a>
          </li>
          <li>
            <a
              href="../reservas/index.html"
              class="menu__link menu__link--ativo"
              aria-current="page"
            >
              <i class="fa-regular fa-calendar"></i>Reservas
            </a>
          </li>
          <li>
            <a href="../perfil/index.html" class="menu__link">
              <i class="fa-regular fa-circle-user"></i>Perfil
            </a>
          </li>
        </ul>
      </nav>

      <a href="../../../index.html" class="menu__link menu__link--sair" data-sair>
        <i class="fa-solid fa-arrow-right-from-bracket"></i>Sair
      </a>
    </aside>

    <div class="overlay"></div>

    <main class="conteudo">
      <header class="cabecalho">
        <div class="cabecalho__inicio">
          <button
            type="button"
            class="botao-menu"
            aria-label="Abrir menu"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="saudacao">
            <p class="saudacao__nome" data-saudacao>Olá!</p>
            <p class="saudacao__texto">
              Aqui você pode visualizar as reservas atuais e anteriores.
            </p>
          </div>
        </div>
        <div class="data-atual">
          <span data-data-atual></span>
          <i class="fa-regular fa-calendar"></i>
        </div>
      </header>

      <h1 class="sr-only">Reservas</h1>

      <section class="grupos-reservas" id="gruposReservas" aria-live="polite">
        <p class="cartao vazio">Carregando reservas...</p>
      </section>

      <div class="mais-reservas">
        <button type="button" class="botao botao--claro" id="verMais" hidden>
          Ver ofertas anteriores
        </button>
      </div>
    </main>

    <div
      class="modal"
      id="modalStatus"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tituloModalStatus"
    >
      <div class="modal__caixa">
        <button type="button" class="modal__fechar" data-fechar aria-label="Fechar">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2 id="tituloModalStatus" class="modal__titulo">Alterar status</h2>
        <p class="modal__texto" id="reservaSelecionada"></p>

        <div class="grupo-campo">
          <label for="novoStatus">Novo status</label>
          <select id="novoStatus" class="campo">
            <option value="ativa">Aguardando retirada</option>
            <option value="retirada">Retirada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>

        <p class="mensagem" id="mensagemStatus" role="alert" hidden></p>

        <div class="modal__acoes">
          <button type="button" class="botao botao--claro" data-fechar>Cancelar</button>
          <button type="button" class="botao botao--verde" id="salvarStatus">Salvar</button>
        </div>
      </div>
    </div>

    <script type="module" src="../../../js/estabelecimento/reservas.js"></script>
  </body>
</html>
